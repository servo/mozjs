name: Security bump

on:
    workflow_dispatch:
    schedule:
        # Runs at 03:30, every Saturday
        - cron: "30 3 * * 3"

jobs:
    bump:
        runs-on: ubuntu-latest
        # We don't want to run the security bump in forks.
        if: github.repository == 'servo/mozjs'
        permissions:
            contents: write
            pull-requests: write
        env:
            GH_TOKEN: ${{ github.token }}
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-python@v6
              with:
                  python-version: "3.14"
            - run: pip install requests
            - run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            - run: python3 ./mozjs-sys/etc/sm-security-bump.py
              id: bump
            - name: Create Pull Request
              uses: peter-evans/create-pull-request@c0f553fe549906ede9cf27b5156039d195d2ece0
              with:
                  title: Security bump SpiderMonkey to ${{ steps.bump.outputs.version }}
                  body: |
                      Bump SpiderMonkey to ${{ steps.bump.outputs.version }} (changeset: [${{ steps.bump.outputs.changeset }}](https://github.com/servo/mozjs/releases/mozjs-source-${{ steps.bump.outputs.changeset }}))

                      Close and reopen this PR to trigger CI.
                  branch: security-bump-esr${{ steps.bump.outputs.esr }}
